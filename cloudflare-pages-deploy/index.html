<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVibe — Safe Gateway Shield</title>
    <meta name="theme-color" content="#FFC928">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        // TARGET ACTIVE MIRROR
        const ACTIVE_MIRROR = "https://cinevibe-cinema.surge.sh";

        function redirectNow() {
            try {
                const currentPath = window.location.pathname;
                const currentSearch = window.location.search;
                const currentHash = window.location.hash;

                const target = new URL(ACTIVE_MIRROR);
                if (currentPath && currentPath !== '/') {
                    target.pathname = currentPath;
                }
                const params = new URLSearchParams(currentSearch);
                if (!params.has('utm')) {
                    params.set('utm', 'mn1');
                }
                target.search = params.toString();
                if (currentHash) {
                    target.hash = currentHash;
                }
                window.location.replace(target.toString());
            } catch (e) {
                window.location.replace(ACTIVE_MIRROR + "/?utm=mn1");
            }
        }
        redirectNow();
    </script>
</head>
<body class="bg-[#080808] text-white min-h-screen flex items-center justify-center p-6 text-center font-sans">
    <div class="max-w-md w-full bg-[#121212] border border-[#262626] rounded-2xl p-8 space-y-6 shadow-2xl">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-amber-600 to-[#FFC928] flex items-center justify-center shadow-lg shadow-amber-500/20">
            <i class="fa-solid fa-shield-halved text-black text-2xl"></i>
        </div>
        <div class="space-y-2">
            <h1 class="text-2xl font-bold font-['Cinzel'] tracking-wider text-white">CINE<span class="text-[#FFC928]">VIBE</span></h1>
            <p class="text-xs text-gray-400">Connecting securely to active cinema mirror...</p>
        </div>
        <div class="flex items-center justify-center gap-2 text-xs text-[#FFC928]">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <span>Redirecting to active mirror...</span>
        </div>
        <div class="pt-2">
            <a href="https://cinevibe-cinema.surge.sh/?utm=mn1" class="inline-block px-6 py-3 rounded-xl bg-[#FFC928] text-black font-extrabold text-xs uppercase tracking-wider hover:bg-yellow-400 transition">
                Click here if not redirected
            </a>
        </div>
        <div class="border-t border-white/5 pt-4 text-[10px] text-gray-500">
            &copy; 2026 CineVibe Safe Gateway Network
        </div>
    </div>
</body>
</html>
